<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oh-My-Live2D Fixed</title>
    <style>
        body {
            background-color: #2b2b2b;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>It works now!</h1>
        <p>Check the bottom left.</p>
    </div>

    <!-- Import the latest version -->
    <script src="https://unpkg.com/oh-my-live2d@latest"></script>

    <script>
        // FIXED: The function name changed from .load() to .loadOml2d()
        OML2D.loadOml2d({
            dockedPosition: "left",
            
            models: [
                {
                    path: 'https://model.oml2d.com/shizuku/shizuku.model.json',
                    scale: 0.15,
                    position: [0, 60],
                    stageStyle: {
                        height: 350
                    }
                }
            ],

            tips: {
                style: {
                    width: 230,
                    height: 120,
                    left: "calc(50% + 20px)",
                    top: "-100px",
                },
                idleTips: {
                    word: ["Hello there!", "Welcome to the site."]
                }
            },
            
            menus: {
                items: [
                    {
                        id: 'home',
                        icon: 'home',
                        title: 'Home',
                        onClick: () => window.location.reload() 
                    }
                ]
            }
        });
    </script>
</body>
</html>
